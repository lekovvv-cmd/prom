[project]
name = "prom-platform-workspace"
version = "0.1.0"
description = "PROM product-platform workspace"
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
  "apps/access-service",
  "apps/*/backend",
  "packages/python/platform-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[dependency-groups]
dev = [
  "coverage==7.14.1",
  "deptry==0.25.1",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pip==26.2",
  "pytest==9.0.3",
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true
show_error_codes = true
warn_unused_configs = true
exclude = [
  "/alembic/",
  "/tests/",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["${COVERAGE_SOURCE?}"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
precision = 2
fail_under = 65

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.html]
directory = "coverage/html"

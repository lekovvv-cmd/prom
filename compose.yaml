name: prom

x-projects-environment: &projects-environment
  PROJECTS_ENV: ${PLATFORM_ENVIRONMENT:-development}
  PROJECTS_DEBUG: ${PLATFORM_DEBUG:-false}
  PROJECTS_DATABASE_URL: postgresql+psycopg://project_showcase:${PROJECTS_DB_PASSWORD:-project_showcase}@postgres:5432/project_showcase
  PROJECTS_UPLOADS_DIR: /workspace/backend/storage/projects
  PROJECTS_ACCESS_JWKS_URL: http://access-service:8002/.well-known/jwks.json
  PROJECTS_ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-prom-access}
  PROJECTS_ACCESS_TOKEN_AUDIENCE: projects
  PROJECTS_WORKER_METRICS_PORT: "9100"

x-service-desk-environment: &service-desk-environment
  SERVICE_DESK_ENV: ${PLATFORM_ENVIRONMENT:-development}
  SERVICE_DESK_DEBUG: ${PLATFORM_DEBUG:-false}
  SERVICE_DESK_DATABASE_URL: postgresql+psycopg://service_desk:${SERVICE_DESK_DB_PASSWORD:-service_desk}@postgres:5432/service_desk
  SERVICE_DESK_STORAGE_DIR: /workspace/backend/storage/service-desk
  SERVICE_DESK_ACCESS_JWKS_URL: http://access-service:8002/.well-known/jwks.json
  SERVICE_DESK_ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-prom-access}
  SERVICE_DESK_ACCESS_TOKEN_AUDIENCE: service-desk
  SERVICE_DESK_WORKER_METRICS_PORT: "9100"

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-prom_local_admin}
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD:-prom_access}
      PROJECTS_DB_PASSWORD: ${PROJECTS_DB_PASSWORD:-project_showcase}
      SERVICE_DESK_DB_PASSWORD: ${SERVICE_DESK_DB_PASSWORD:-service_desk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 60s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  access-service:
    image: prom-access-service:local
    build: &access-build
      context: .
      dockerfile: apps/access-service/Dockerfile
    environment: &access-environment
      ACCESS_DATABASE_URL: postgresql+psycopg://prom_access:${ACCESS_DB_PASSWORD:-prom_access}@postgres:5432/prom_access
      ACCESS_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-development}
      ACCESS_DEBUG: ${PLATFORM_DEBUG:-false}
      ACCESS_JWT_PRIVATE_KEY: ${ACCESS_JWT_PRIVATE_KEY:-}
      ACCESS_JWT_PRIVATE_KEY_FILE: ${ACCESS_JWT_PRIVATE_KEY_FILE:-}
      ACCESS_JWT_KEY_ID: ${ACCESS_JWT_KEY_ID:-local-ephemeral}
      ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-prom-access}
      ACCESS_TOKEN_AUDIENCES: ${ACCESS_TOKEN_AUDIENCES:-projects,service-desk}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  projects-backend:
    image: prom-projects-backend:local
    build: &projects-build
      context: .
      dockerfile: apps/projects/backend/Dockerfile
    environment: *projects-environment
    volumes: ["projects_storage:/workspace/backend/storage/projects"]
    depends_on:
      postgres: { condition: service_healthy }
      access-service: { condition: service_healthy }
    restart: unless-stopped

  projects-worker:
    image: prom-projects-backend:local
    build: *projects-build
    environment: *projects-environment
    volumes: ["projects_storage:/workspace/backend/storage/projects"]
    depends_on:
      projects-backend: { condition: service_healthy }
    command: ["python", "-m", "scripts.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker", "--health"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  service-desk-backend:
    image: prom-service-desk-backend:local
    build: &service-desk-build
      context: .
      dockerfile: apps/service-desk/backend/Dockerfile
    environment: *service-desk-environment
    volumes: ["service_desk_storage:/workspace/backend/storage/service-desk"]
    depends_on:
      postgres: { condition: service_healthy }
      access-service: { condition: service_healthy }
    restart: unless-stopped

  service-desk-worker:
    image: prom-service-desk-backend:local
    build: *service-desk-build
    environment: *service-desk-environment
    volumes: ["service_desk_storage:/workspace/backend/storage/service-desk"]
    depends_on:
      service-desk-backend: { condition: service_healthy }
    command: ["python", "-m", "scripts.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker", "--health"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  platform-shell:
    build:
      context: .
      dockerfile: apps/platform-shell/Dockerfile
      args:
        VITE_API_BASE_URL: /api/projects/v1
        VITE_SERVICE_DESK_API_BASE_URL: /api/service-desk/v1
        VITE_ACCESS_API_BASE_URL: /api/access/v1
    ports: ["5173:80"]
    depends_on:
      access-service: { condition: service_healthy }
      projects-backend: { condition: service_healthy }
      service-desk-backend: { condition: service_healthy }
    restart: unless-stopped

  access-migrate:
    image: prom-access-service:local
    build: *access-build
    profiles: ["tooling"]
    environment: *access-environment
    command: ["python", "scripts/init_db.py"]
    restart: "no"

  projects-migrate:
    image: prom-projects-backend:local
    build: *projects-build
    profiles: ["tooling"]
    environment: *projects-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  service-desk-migrate:
    image: prom-service-desk-backend:local
    build: *service-desk-build
    profiles: ["tooling"]
    environment: *service-desk-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  access-seed:
    image: prom-access-service:local
    build: *access-build
    profiles: ["tooling"]
    environment: *access-environment
    command: ["python", "scripts/seed.py"]
    restart: "no"

  projects-seed:
    image: prom-projects-backend:local
    build: *projects-build
    profiles: ["tooling"]
    environment: *projects-environment
    command: ["python", "scripts/seed.py"]
    restart: "no"

  platform-bootstrap:
    image: prom-service-desk-backend:local
    build: *service-desk-build
    profiles: ["tooling"]
    environment: *service-desk-environment
    command: ["python", "scripts/bootstrap_identity.py"]
    restart: "no"

  service-desk-seed:
    image: prom-service-desk-backend:local
    build: *service-desk-build
    profiles: ["tooling"]
    environment: *service-desk-environment
    command: ["python", "-m", "scripts.seed_if_empty"]
    restart: "no"

  projects-tests:
    profiles: ["test"]
    build:
      <<: *projects-build
      target: test
    command: ["python", "-m", "pytest", "-q"]

  service-desk-tests:
    profiles: ["test"]
    build:
      <<: *service-desk-build
      target: test
    command: ["python", "-m", "pytest", "-q"]

  frontend-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/platform-shell/Dockerfile
      target: build
    command: ["npm", "test"]

volumes:
  postgres_data:
  projects_storage:
  service_desk_storage:

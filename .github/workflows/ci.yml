name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: 0.11.29
  PYTHON_VERSION: 3.14.6
  NODE_VERSION: 24.13.1
  TRIVY_VERSION: 0.70.0
  PROJECTS_DATABASE_URL: sqlite:///ci.db
  PROJECTS_JWT_SECRET: ci-secret-with-at-least-thirty-two-bytes
  SERVICE_DESK_DATABASE_URL: sqlite:///ci_service_desk.db
  SERVICE_DESK_JWT_SECRET: ci-secret-with-at-least-thirty-two-bytes
  PLATFORM_FRONTEND_ORIGIN: http://localhost:5173

jobs:
  detect-changes:
    name: Detect affected modules
    runs-on: ubuntu-latest
    outputs:
      access: ${{ steps.filter.outputs.access }}
      projects: ${{ steps.filter.outputs.projects }}
      service_desk: ${{ steps.filter.outputs.service_desk }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sdk: ${{ steps.filter.outputs.sdk }}
      contracts: ${{ steps.filter.outputs.contracts }}
      infra: ${{ steps.filter.outputs.infra }}
      python: ${{ steps.filter.outputs.python }}
      modules: ${{ steps.filter.outputs.modules }}
      generated_matrix: ${{ steps.generated.outputs.matrix }}
      has_generated_modules: ${{ steps.generated.outputs.has_modules }}
      business_matrix: ${{ steps.business.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            access:
              - '.github/workflows/**'
              - 'apps/access-service/**'
              - 'packages/python/platform-sdk/**'
              - 'packages/frontend/auth/**'
              - 'packages/frontend/api-client/**'
              - 'packages/frontend/ui/**'
              - 'tools/gateway/**'
            projects:
              - '.github/workflows/**'
              - 'apps/projects/**'
              - 'packages/python/platform-sdk/**'
              - 'packages/frontend/auth/**'
              - 'packages/frontend/api-client/**'
              - 'packages/frontend/ui/**'
              - 'tools/gateway/**'
            service_desk:
              - '.github/workflows/**'
              - 'apps/service-desk/**'
              - 'packages/python/platform-sdk/**'
              - 'packages/frontend/auth/**'
              - 'packages/frontend/api-client/**'
              - 'packages/frontend/ui/**'
              - 'tools/gateway/**'
            frontend:
              - '.github/workflows/**'
              - 'apps/platform-shell/**'
              - 'apps/*/frontend/**'
              - 'packages/frontend/**'
              - 'contracts/generated/**'
              - 'tools/frontend/**'
              - 'tools/gateway/**'
              - 'eslint.config.mjs'
              - 'knip.json'
              - 'package.json'
              - 'package-lock.json'
            sdk:
              - '.github/workflows/**'
              - 'packages/python/platform-sdk/**'
            contracts:
              - '.github/workflows/**'
              - 'contracts/**'
              - 'tools/contracts/**'
              - 'apps/access-service/src/access_service/api/**'
              - 'apps/projects/backend/app/api/**'
              - 'apps/service-desk/backend/app/api/**'
              - 'package.json'
              - 'package-lock.json'
            infra:
              - '.github/workflows/**'
              - 'compose.yaml'
              - '.env.example'
              - 'apps/**/Dockerfile'
              - 'apps/platform-shell/nginx.conf'
              - 'tools/gateway/**'
              - 'dev.sh'
              - 'dev.ps1'
              - 'dev.cmd'
            python:
              - '.github/workflows/**'
              - 'apps/access-service/**'
              - 'apps/*/backend/**'
              - 'packages/python/platform-sdk/**'
              - 'tools/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
            modules:
              - '.github/workflows/**'
              - 'apps/*/backend/**'
              - 'apps/*/frontend/**'
              - 'apps/*/platform/registration.json'
              - 'packages/python/platform-sdk/**'
              - 'packages/frontend/**'
              - 'tools/**'
              - 'compose.yaml'
              - 'apps/platform-shell/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pyproject.toml'
              - 'uv.lock'
      - id: generated
        run: |
          matrix="$(python tools/ci/discover_generated_modules.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          fi
      - id: business
        run: echo "matrix=$(python tools/ci/discover_generated_modules.py --business)" >> "$GITHUB_OUTPUT"

  architecture-check:
    name: Architecture boundaries
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv lock --check
      - name: Run architecture and CI tooling regression tests
        run: >
          uv run --frozen python -m pytest -q
          tools/architecture/test_check.py
          tools/ci/test_discover_generated_modules.py
      - run: python tools/architecture/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tools/gateway/check.mjs
      - run: docker compose config --quiet

  module-generator-smoke:
    name: Module generator acceptance
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --frozen python -m pytest -q tools/generators/test_create_module.py
      - name: Verify generated-module authorization flow
        run: uv run --frozen --package prom-access-service --extra dev python -m pytest -q tools/generators/test_module_authorization_e2e.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: python tools/generators/create_module.py audit-sample-module
      - run: python tools/generators/create_module.py audit-sample-module --check
      - run: uv run --frozen --group dev ruff check apps/audit-sample-module/backend
      - run: .venv/bin/mypy apps/audit-sample-module/backend/src
      - run: uv run --frozen --group dev deptry apps/audit-sample-module/backend/src --config apps/audit-sample-module/backend/pyproject.toml
      - run: uv run --frozen --package prom-audit-sample-module-backend --extra dev python -m pytest -q apps/audit-sample-module/backend/tests
      - run: docker compose --profile audit-sample-module up --build -d --wait audit-sample-module-backend
      - name: Verify live generated-module Access authorization
        run: |
          test_key="$RUNNER_TEMP/prom-live-access-test.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$test_key"
          export ACCESS_JWT_PRIVATE_KEY="$(<"$test_key")"
          export ACCESS_JWT_KEY_ID="live-generator-access"
          docker compose --profile core --profile audit-sample-module up --build -d --wait \
            access-db access-migrate access-service \
            audit-sample-module-db audit-sample-module-migrate audit-sample-module-backend \
            platform-shell
          docker compose --profile core run --rm access-seed
          PROM_LIVE_ACCESS_TEST_KEY_FILE="$test_key" \
          PROM_LIVE_ACCESS_TEST_KEY_ID="$ACCESS_JWT_KEY_ID" \
          uv run --frozen --package prom-access-service --extra dev python tools/generators/live_module_authorization_e2e.py
      - run: npm run format:check
      - run: npm run check:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:styles
      - run: npm run check:dead-code
      - run: npm run build
      - run: npm run check:contracts
      - run: node tools/gateway/check.mjs
      - run: python tools/architecture/check.py
      - name: Capture generator acceptance diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color access-service access-migrate audit-sample-module-backend audit-sample-module-migrate audit-sample-module-db
      - name: Stop generator acceptance stack
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Remove generated module
        if: always()
        run: python tools/generators/create_module.py audit-sample-module --remove
      - run: git diff --exit-code

  python-lint:
    name: Python lint
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras --group dev
      - run: >
          uv run --frozen --group dev ruff check
          packages/python/platform-sdk
          apps/access-service
          apps/*/backend
          tools
      - name: Check Python dependency ownership
        run: |
          uv run --frozen --group dev deptry packages/python/platform-sdk/src --config packages/python/platform-sdk/pyproject.toml
          uv run --frozen --group dev deptry apps/access-service/src --config apps/access-service/pyproject.toml
          for module in apps/*/backend; do
            sources=()
            for source in "$module/src" "$module/app" "$module/scripts"; do
              if [ -d "$source" ]; then
                sources+=("$source")
              fi
            done
            uv run --frozen --group dev deptry "${sources[@]}" --config "$module/pyproject.toml"
          done

  python-type-check:
    name: Python type check
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras --group dev
      - name: Type-check workspace packages and every business backend
        run: |
          (cd packages/python/platform-sdk && ../../../.venv/bin/mypy src)
          (cd apps/access-service && ../../.venv/bin/mypy src)
          for module in apps/*/backend; do
            if [ -d "$module/src" ]; then
              .venv/bin/mypy "$module/src"
            else
              .venv/bin/mypy "$module/app"
            fi
          done

  platform-sdk-tests:
    name: Platform SDK tests
    needs: detect-changes
    if: needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package prom-platform-sdk --extra dev
      - run: uv run --frozen --package prom-platform-sdk --extra dev python -m pytest -q packages/python/platform-sdk/tests

  business-module-tests:
    name: Business module tests (${{ matrix.module }})
    needs: detect-changes
    if: needs.detect-changes.outputs.modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.business_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras --group dev
      - run: uv run --frozen --package "${{ matrix.package }}" --extra dev python -m pytest -q "${{ matrix.tests }}"

  access-service-tests:
    name: Access Service tests
    needs: detect-changes
    if: needs.detect-changes.outputs.access == 'true' || needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package prom-access-service --extra dev
      - run: uv run --frozen --package prom-access-service --extra dev python -m pytest -q apps/access-service/tests

  access-postgres-integration:
    name: Access PostgreSQL, group RBAC, and key rotation
    needs: detect-changes
    if: needs.detect-changes.outputs.access == 'true' || needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: access_test
          POSTGRES_USER: access
          POSTGRES_PASSWORD: access
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U access -d access_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ACCESS_DATABASE_URL: postgresql+psycopg://access:access@localhost:5432/access_test
      ACCESS_TEST_DATABASE_URL: postgresql+psycopg://access:access@localhost:5432/access_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package prom-access-service --extra dev
      - name: Apply Access migrations to PostgreSQL
        working-directory: apps/access-service
        run: ../../.venv/bin/alembic upgrade head
      - name: Exercise PostgreSQL group RBAC and persisted key rotation
        run: >
          uv run --frozen --package prom-access-service --extra dev python -m pytest -q
          apps/access-service/tests/test_postgres_integration.py
      - name: Re-run negative RBAC and rotation suites
        run: >
          uv run --frozen --package prom-access-service --extra dev python -m pytest -q
          apps/access-service/tests/test_access_rbac.py
          apps/access-service/tests/test_signing_key_rotation.py

  legacy-identity-migration:
    name: Legacy identity migration rehearsal
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.access == 'true' ||
      needs.detect-changes.outputs.projects == 'true' ||
      needs.detect-changes.outputs.service_desk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package prom-access-service --extra dev
      - name: Verify UUID, relationship, conflict, and idempotency behavior
        run: >
          uv run --frozen --package prom-access-service --extra dev python -m pytest -q
          apps/access-service/tests/test_identity_migration.py
      - name: Start long-running PostgreSQL-backed services
        run: docker compose --profile full up --build -d --wait
      - name: Run and verify representative seed jobs
        run: |
          for service in access-seed projects-seed service-desk-seed; do
            if docker compose --profile full --profile demo run --rm --no-deps "$service"; then
              exit_code=0
            else
              exit_code=$?
            fi
            test "$exit_code" -eq 0
          done
      - name: Rehearse dry-run, partial recovery, and repeatable apply against PostgreSQL
        run: |
          mkdir -p outputs/identity-migration
          chmod 0777 outputs/identity-migration
          docker compose --profile migration run --rm --entrypoint python access-identity-migrate scripts/rehearse_identity_resumability.py
          docker compose --profile migration run --rm access-identity-migrate --dry-run
          docker compose --profile migration run --rm access-identity-migrate --apply
          docker compose --profile migration run --rm access-identity-migrate --apply
          test -s outputs/identity-migration/identity-reconciliation.json
          test -s outputs/identity-migration/identity-reconciliation.md
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose ps --all > docker-compose-ps.txt
          docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legacy-identity-migration-diagnostics
          path: |
            docker-compose-ps.txt
            docker-compose.log
            outputs/identity-migration
      - name: Stop rehearsal databases
        if: always()
        run: docker compose down -v --remove-orphans

  projects-tests:
    name: Projects unit tests
    needs: detect-changes
    if: needs.detect-changes.outputs.projects == 'true' || needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package shpiu-project-showcase-backend --extra dev
      - run: uv run --frozen --package shpiu-project-showcase-backend --extra dev python -m pytest -q apps/projects/backend/tests
      - name: Re-run storage transaction and rollback boundary tests
        run: >
          uv run --frozen --package shpiu-project-showcase-backend --extra dev python -m pytest -q
          apps/projects/backend/tests/test_projects_integrity.py

  service-desk-tests:
    name: Service Desk unit tests
    needs: detect-changes
    if: needs.detect-changes.outputs.service_desk == 'true' || needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package shpiu-service-desk-backend --extra dev
      - run: uv run --frozen --package shpiu-service-desk-backend --extra dev python -m pytest -q apps/service-desk/backend/tests

  projects-postgres-integration:
    name: Projects PostgreSQL integration
    needs: detect-changes
    if: needs.detect-changes.outputs.projects == 'true' || needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: projects_test
          POSTGRES_USER: projects
          POSTGRES_PASSWORD: projects
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U projects -d projects_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PROJECTS_DATABASE_URL: postgresql+psycopg://projects:projects@localhost:5432/projects_test
      PROJECTS_TEST_DATABASE_URL: postgresql+psycopg://projects:projects@localhost:5432/projects_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package shpiu-project-showcase-backend --extra dev
      - name: Verify migrations on PostgreSQL
        working-directory: apps/projects/backend
        run: ../../../.venv/bin/alembic upgrade head
      - run: uv run --frozen --package shpiu-project-showcase-backend --extra dev python -m pytest -q apps/projects/backend/tests/test_postgres_integration.py apps/projects/backend/tests/test_projects_integrity.py

  service-desk-postgres-concurrency:
    name: Service Desk PostgreSQL concurrency
    needs: detect-changes
    if: needs.detect-changes.outputs.service_desk == 'true' || needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: service_desk_test
          POSTGRES_USER: service_desk
          POSTGRES_PASSWORD: service_desk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U service_desk -d service_desk_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SERVICE_DESK_DATABASE_URL: postgresql+psycopg://service_desk:service_desk@localhost:5432/service_desk_test
      SERVICE_DESK_TEST_DATABASE_URL: postgresql+psycopg://service_desk:service_desk@localhost:5432/service_desk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --package shpiu-service-desk-backend --extra dev
      - name: Verify migrations and bootstrap on PostgreSQL
        working-directory: apps/service-desk/backend
        run: |
          ../../../.venv/bin/alembic upgrade head
          ../../../.venv/bin/python scripts/bootstrap_identity.py
          ../../../.venv/bin/python scripts/seed.py
      - run: uv run --frozen --package shpiu-service-desk-backend --extra dev python -m pytest -q apps/service-desk/backend/tests/test_postgres_concurrency.py
      - run: uv run --frozen --package shpiu-service-desk-backend --extra dev python -m pytest -q apps/service-desk/backend/tests/test_notification_outbox.py
      - run: uv run --frozen --package shpiu-service-desk-backend --extra dev python -m pytest -q apps/service-desk/backend/tests/test_sla_worker.py
      - run: uv run --frozen --package shpiu-service-desk-backend --extra dev python -m pytest -q apps/service-desk/backend/tests/test_admin_access.py::test_last_active_service_desk_admin_is_protected

  frontend-tests:
    name: Frontend quality gates
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:styles
      - run: npm run check:dead-code
      - name: Audit production npm dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

  frontend-build:
    name: Frontend production build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:check
      - uses: actions/upload-artifact@v4
        with:
          name: platform-shell-dist
          path: apps/platform-shell/dist

  contract-check:
    name: OpenAPI and generated contracts
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.contracts == 'true' ||
      needs.detect-changes.outputs.access == 'true' ||
      needs.detect-changes.outputs.projects == 'true' ||
      needs.detect-changes.outputs.service_desk == 'true' ||
      needs.detect-changes.outputs.modules == 'true'
    runs-on: ubuntu-latest
    env:
      PROM_PYTHON: .venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: uv sync --locked --all-packages --all-extras
      - run: npm ci
      - run: npm run check:contracts

  docker-build:
    name: Docker build and image scan (${{ matrix.name }})
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.access == 'true' ||
      needs.detect-changes.outputs.projects == 'true' ||
      needs.detect-changes.outputs.service_desk == 'true' ||
      needs.detect-changes.outputs.modules == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: access-service
            dockerfile: apps/access-service/Dockerfile
          - name: projects-backend
            dockerfile: apps/projects/backend/Dockerfile
          - name: service-desk-backend
            dockerfile: apps/service-desk/backend/Dockerfile
          - name: platform-shell
            dockerfile: apps/platform-shell/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build SHA-tagged image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "prom/${{ matrix.name }}:${GITHUB_SHA}" .
      - name: Scan image for fixed critical vulnerabilities
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          "aquasec/trivy:${TRIVY_VERSION}"
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          "prom/${{ matrix.name }}:${GITHUB_SHA}"

  generated-module-docker-build:
    name: Generated module Docker build and image scan (${{ matrix.module }})
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.modules == 'true' &&
      needs.detect-changes.outputs.has_generated_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.generated_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build SHA-tagged generated module image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "prom/${{ matrix.module }}:${GITHUB_SHA}" .
      - name: Scan image for fixed critical vulnerabilities
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          "aquasec/trivy:${TRIVY_VERSION}"
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          "prom/${{ matrix.module }}:${GITHUB_SHA}"

  module-e2e:
    name: Module profile smoke (${{ matrix.module }})
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.projects == 'true' ||
      needs.detect-changes.outputs.service_desk == 'true' ||
      needs.detect-changes.outputs.access == 'true' ||
      needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [projects, service-desk]
    steps:
      - uses: actions/checkout@v4
      - name: Start affected module profile through the gateway
        run: docker compose --profile core --profile "${{ matrix.module }}" up --build -d --wait
      - name: Verify canonical gateway health routes
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/healthz
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/api/access/v1/health/ready
          if [ "${{ matrix.module }}" = "projects" ]; then
            curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/api/projects/v1/health
          else
            curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/api/service-desk/v1/health/ready
          fi
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose ps --all > docker-compose-ps.txt
          docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: module-e2e-${{ matrix.module }}
          path: |
            docker-compose-ps.txt
            docker-compose.log
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  generated-module-e2e:
    name: Generated module profile smoke (${{ matrix.module }})
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.modules == 'true' &&
      needs.detect-changes.outputs.has_generated_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.generated_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Start generated module profile through the gateway
        run: docker compose --profile core --profile "${{ matrix.module }}" up --build -d --wait
      - name: Verify generated module health through its registered gateway prefix
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/healthz
          curl --fail --retry 10 --retry-delay 2 "http://127.0.0.1:5173${{ matrix.health_path }}"
      - name: Capture diagnostics
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  full-stack-e2e:
    name: Full stack Playwright
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.access == 'true' ||
      needs.detect-changes.outputs.projects == 'true' ||
      needs.detect-changes.outputs.service_desk == 'true' ||
      needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm exec --workspace=@prom/platform-shell playwright install --with-deps chromium
      - name: Remove all prior volumes and orphan containers
        run: docker compose down -v --remove-orphans
      - name: Start production-like stack
        run: docker compose --profile full up --build -d --wait
      - name: Load idempotent demo fixtures for browser scenarios
        run: docker compose --profile full --profile demo up -d --wait
      - name: Record clean-stack health
        run: docker compose ps --all
      - name: Verify live Access SSO routing through the public gateway
        run: python tools/gateway/live_access_sso_e2e.py
      - name: Run Playwright through the versioned gateway
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_SERVICE_DESK_URL: http://127.0.0.1:5173/api/service-desk/v1
        run: npm run test:e2e --workspace=@prom/platform-shell
      - name: Capture Docker diagnostics
        if: always()
        run: |
          docker compose ps --all > docker-compose-ps.txt
          docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-stack-e2e-diagnostics
          path: |
            docker-compose-ps.txt
            docker-compose.log
            apps/platform-shell/playwright-report
            apps/platform-shell/test-results
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  security-scan:
    name: Dependency and repository security scan
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: uv sync --locked --all-packages --all-extras --group dev
      - run: uv run --frozen --group dev pip-audit --local --skip-editable
      - run: npm ci
      - name: Audit production npm dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Scan repository for critical vulnerabilities, secrets, and misconfiguration
        run: >
          docker run --rm
          -v "${PWD}:/workspace"
          "aquasec/trivy:${TRIVY_VERSION}"
          fs --exit-code 1 --severity CRITICAL
          --scanners vuln,secret,misconfig
          /workspace
